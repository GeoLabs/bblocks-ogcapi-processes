get:
  summary: retrieve the list of jobs.
  description: 'Lists available jobs.


    For more information, see [Section 12](https://docs.ogc.org/is/18-062r2/18-062r2.html#Job_list).

    '
  operationId: getJobs
  tags:
  - Jobs
  parameters:
  - $ref: https://geolabs.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/part1/v2/parameters/limit/openapi.yaml
  - $ref: https://geolabs.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/part1/v2/parameters/processIdQueryParam/openapi.yaml
  - $ref: https://geolabs.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/part1/v2/parameters/status/openapi.yaml
  - $ref: https://geolabs.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/part1/v2/parameters/minDuration/openapi.yaml
  - $ref: https://geolabs.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/part1/v2/parameters/maxDuration/openapi.yaml
  - $ref: https://geolabs.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/part1/v2/parameters/type/openapi.yaml
  - $ref: https://geolabs.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/part1/v2/parameters/datetime/openapi.yaml
  responses:
    200:
      $ref: https://geolabs.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/part1/v2/responses/JobList/openapi.yaml
    404:
      $ref: https://geolabs.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/part1/v2/responses/NotFound/openapi.yaml
