get:
  summary: retrieve the status of a job
  description: "Shows the status of a job.\n\n For more information, see [Section
    7.10](https://docs.ogc.org/is/18-062r2/18-062r2.html#sc_retrieve_status_info).\n"
  operationId: getStatus
  tags:
  - Jobs
  parameters:
  - $ref: https://geolabs.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/part1/v2/parameters/jobId/openapi.yaml
  responses:
    200:
      $ref: https://geolabs.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/part1/v2/responses/Status/openapi.yaml
    404:
      $ref: https://geolabs.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/part1/v2/responses/NotFound/openapi.yaml
    500:
      $ref: https://geolabs.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/part1/v2/responses/ServerError/openapi.yaml
