description: Result of synchronous execution
content:
  application/json:
    schema:
      anyOf:
      - oneOf:
        - type: string
        - type: number
        - type: integer
        - type: object
          nullable: true
        - type: array
          items: {}
        - type: boolean
        - type: string
          format: binary
      - $ref: https://geolabs.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/part1/v2/schemas/results/schema.yaml
  image/png:
    schema:
      type: string
      format: binary
  image/jpeg:
    schema:
      type: string
      format: binary
  image/tiff; application=geotiff:
    schema:
      type: string
      format: binary
  application/geo+json:
    schema:
      allOf:
      - format: geojson-feature-collection
      - $ref: https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/0f9c3d88ccdb1802f6356fd39e7963df7b8dadae/openapi/schemas/geojson/FeatureCollection.yaml
