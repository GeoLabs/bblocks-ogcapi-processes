get:
  summary: retrieve the status of a job
  description: "Shows the status of a job.\n\n For more information, see [Section 7.12](https://docs.ogc.org/is/18-062/18-062.html#sc_retrieve_status_info).\n"
  operationId: getStatus
  tags:
  - Status
  parameters:
  - $ref: bblocks://ogc.api.processes.part1.v1.parameters.jobId
  responses:
    200:
      $ref: bblocks://ogc.api.processes.part1.v1.responses.Status
    404:
      $ref: bblocks://ogc.api.processes.part1.v1.responses.NotFound
    500:
      $ref: bblocks://ogc.api.processes.part1.v1.responses.ServerError
