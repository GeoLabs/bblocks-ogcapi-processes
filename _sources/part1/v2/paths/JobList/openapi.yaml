get:
  summary: retrieve the list of jobs.
  description: 'Lists available jobs.


    For more information, see [Section 12](https://docs.ogc.org/is/18-062r2/18-062r2.html#Job_list).

    '
  operationId: getJobs
  tags:
  - Jobs
  parameters:
  - $ref: bblocks://ogc.api.processes.part1.v2.parameters.limit
  - $ref: bblocks://ogc.api.processes.part1.v2.parameters.processIdQueryParam
  - $ref: bblocks://ogc.api.processes.part1.v2.parameters.status
  - $ref: bblocks://ogc.api.processes.part1.v2.parameters.minDuration
  - $ref: bblocks://ogc.api.processes.part1.v2.parameters.maxDuration
  - $ref: bblocks://ogc.api.processes.part1.v2.parameters.type
  - $ref: bblocks://ogc.api.processes.part1.v2.parameters.datetime
  responses:
    200:
      $ref: bblocks://ogc.api.processes.part1.v2.responses.JobList
    404:
      $ref: bblocks://ogc.api.processes.part1.v2.responses.NotFound
