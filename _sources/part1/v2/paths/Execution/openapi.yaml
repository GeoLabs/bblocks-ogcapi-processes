post:
  summary: execute a process.
  description: 'Executes a process (this may result in the creation of a job resource e.g.,
    for _asynchronous execution_).


    For more information, see [Section 7.9](https://docs.ogc.org/is/18-062r2/18-062r2.html#sc_create_job).

    '
  operationId: execute
  tags:
  - Processes
  - Core
  parameters:
  - $ref: bblocks://ogc.api.processes.part1.v2.parameters.processIdPathParam
  - $ref: bblocks://ogc.api.processes.part1.v2.parameters.processes-core.response
  - $ref: bblocks://ogc.api.processes.part1.v2.parameters.processes-core.prefer-header-execution
  requestBody:
    description: 'An execution request specifying any inputs for the process to execute, and
      optionally to select specific outputs.

      With support for _Part 3: Workflows and chaining_, this execution request may specify
      a complex processing workflow

      e.g., including nested processes and OGC API collections as inputs.'
    required: true
    content:
      application/json:
        schema:
          $ref: bblocks://ogc.api.processes.part1.v2.schemas.execute
  responses:
    200:
      $ref: bblocks://ogc.api.processes.part1.v2.responses.ExecuteSync
    201:
      $ref: bblocks://ogc.api.processes.part1.v2.responses.ExecuteAsync
    204:
      $ref: bblocks://ogc.api.processes.part1.v2.responses.processes-core.rEmpty
    303:
      $ref: bblocks://ogc.api.processes.part1.v2.responses.processes-core.rExecuteCollectionRedirect
    404:
      $ref: bblocks://ogc.api.processes.part1.v2.responses.NotFound
    500:
      $ref: bblocks://ogc.api.processes.part1.v2.responses.ServerError
  callbacks:
    jobCompleted:
      '{$request.body#/subscriber/successUri}':
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: bblocks://ogc.api.processes.part1.v2.schemas.results
          responses:
            200:
              description: Results received successfully
