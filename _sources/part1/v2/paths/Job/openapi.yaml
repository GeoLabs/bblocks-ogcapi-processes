get:
  summary: retrieve the status of a job
  description: "Shows the status of a job.\n\n For more information, see [Section 7.10](https://docs.ogc.org/is/18-062r2/18-062r2.html#sc_retrieve_status_info).\n"
  operationId: getStatus
  tags:
  - Jobs
  parameters:
  - $ref: bblocks://ogc.api.processes.part1.v2.parameters.jobId
  responses:
    200:
      $ref: bblocks://ogc.api.processes.part1.v2.responses.Status
    404:
      $ref: bblocks://ogc.api.processes.part1.v2.responses.NotFound
    500:
      $ref: bblocks://ogc.api.processes.part1.v2.responses.ServerError
